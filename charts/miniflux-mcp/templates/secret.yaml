{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "miniflux-mcp.secretName" . }}
  labels:
    {{- include "miniflux-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  MCP_AUTH_TOKEN: {{ required "mcp.authToken is required" .Values.mcp.authToken | quote }}
  {{- if .Values.miniflux.apiKey }}
  MINIFLUX_API_KEY: {{ .Values.miniflux.apiKey | quote }}
  {{- else }}
  MINIFLUX_USERNAME: {{ required "miniflux.username is required when apiKey is empty" .Values.miniflux.username | quote }}
  MINIFLUX_PASSWORD: {{ required "miniflux.password is required when apiKey is empty" .Values.miniflux.password | quote }}
  {{- end }}
{{- end }}
