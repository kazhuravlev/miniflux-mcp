apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "miniflux-mcp.fullname" . }}
  labels:
    {{- include "miniflux-mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "miniflux-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "miniflux-mcp.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: miniflux-mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: MINIFLUX_URL
              value: {{ required "miniflux.url is required" .Values.miniflux.url | quote }}
            - name: MCP_TRANSPORT
              value: {{ .Values.mcp.transport | quote }}
            - name: MCP_HTTP_ADDR
              value: {{ .Values.mcp.httpAddr | quote }}
            - name: MCP_HTTP_PATH
              value: {{ .Values.mcp.httpPath | quote }}
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "miniflux-mcp.secretName" . }}
                  key: MCP_AUTH_TOKEN
            {{- if .Values.miniflux.apiKey }}
            - name: MINIFLUX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "miniflux-mcp.secretName" . }}
                  key: MINIFLUX_API_KEY
            {{- else }}
            - name: MINIFLUX_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "miniflux-mcp.secretName" . }}
                  key: MINIFLUX_USERNAME
            - name: MINIFLUX_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "miniflux-mcp.secretName" . }}
                  key: MINIFLUX_PASSWORD
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
