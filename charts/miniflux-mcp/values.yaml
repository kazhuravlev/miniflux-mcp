replicaCount: 1

image:
  repository: jwonder/miniflux-mcp
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

miniflux:
  # URL reachable by the pod. For a same-namespace Miniflux Service, this is
  # commonly http://miniflux:8080.
  url: http://miniflux:8080
  apiKey: ""
  username: ""
  password: ""

mcp:
  transport: streamable-http
  httpAddr: ":8080"
  httpPath: /mcp
  authToken: ""

# Set this to use a pre-created Secret. It must contain MCP_AUTH_TOKEN and
# either MINIFLUX_API_KEY or both MINIFLUX_USERNAME and MINIFLUX_PASSWORD.
existingSecret: ""

# Ingress is enabled by default for a conventional community installation.
# Set ingress.className to tailscale (and adjust annotations) for Tailscale.
ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: mcp.example.com
      paths:
        - path: /mcp
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
